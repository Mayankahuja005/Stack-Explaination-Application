<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stack Master</title>
<style>
:root{--bg:#fff7ed;--card:#ffffff;--tx:#1f2937;--mu:#6b7280;--ac:#6366f1;--bd:#e5e7eb;--ok:#16a34a;--bad:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111827;--card:#1f2937;--tx:#f3f4f6;--mu:#9ca3af;--bd:#374151}}
:root[data-theme="dark"]{--bg:#111827;--card:#1f2937;--tx:#f3f4f6;--mu:#9ca3af;--bd:#374151}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Trebuchet MS",system-ui,sans-serif;line-height:1.5}
.w{max-width:640px;margin:0 auto;padding:14px}
h1{margin:4px 0 2px;font-size:26px;text-align:center}
.sub{text-align:center;color:var(--mu);margin:0 0 12px;font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px 4px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:12px;align-items:stretch}
.stackbox{width:150px;min-height:300px;border:4px solid var(--tx);border-top:none;border-radius:0 0 14px 14px;display:flex;flex-direction:column-reverse;gap:4px;padding:6px;position:relative;flex-shrink:0}
.plate{height:38px;border-radius:10px;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px;text-shadow:0 1px 2px #0006;animation:pop .25s}
.plate.top{outline:3px dashed var(--tx);outline-offset:2px}
.plate.flash{animation:flash .6s 2}
@keyframes pop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
@keyframes flash{50%{transform:scale(1.08)}}
.topt{position:absolute;right:-2px;font-size:12px;font-weight:700;color:var(--ac)}
.side{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.pal{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:38px;height:38px;border-radius:50%;border:3px solid var(--bd);cursor:pointer}
.btn{padding:10px 12px;border:none;border-radius:12px;font-size:15px;font-weight:700;color:#fff;cursor:pointer}
.b1{background:#22c55e}.b2{background:#ef4444}.b3{background:#3b82f6}.b4{background:#a855f7}.b5{background:var(--ac)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.msg{background:var(--bg);border-radius:12px;padding:10px;font-size:14px;min-height:64px}
.big{font-size:17px;font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.opt{padding:10px 16px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}
.opt.right{background:var(--ok);color:#fff}.opt.wrong{background:var(--bad);color:#fff}
.chip{display:inline-block;padding:2px 12px;border-radius:20px;color:#fff;font-weight:700}
.ops{font-family:monospace;font-size:15px;background:var(--bg);border-radius:10px;padding:10px}
.score{text-align:center;font-weight:700;color:var(--ac)}
.tip{font-size:13px;color:var(--mu)}
@media (max-width:420px){.stackbox{width:120px}}
</style>
</head>
<body>
<div class="w">
<h1>📚 Stack Master</h1>
<p class="sub">Learn LIFO with a stack of plates: Last In, First Out!</p>
<div class="tabs">
<button id="t0" class="on" onclick="tab(0)">🎓 Learn</button>
<button id="t1" onclick="tab(1)">🎯 Mission</button>
<button id="t2" onclick="tab(2)">🧠 Quiz</button>
</div>
<div id="p0"></div><div id="p1" hidden></div><div id="p2" hidden></div>
</div>
<script>
var C=[{n:"Red",c:"#ef4444"},{n:"Blue",c:"#3b82f6"},{n:"Green",c:"#22c55e"},{n:"Yellow",c:"#ca8a04"},{n:"Purple",c:"#a855f7"},{n:"Orange",c:"#f97316"}];
function $(i){return document.getElementById(i)}
function tab(i){for(var k=0;k<3;k++){$("p"+k).hidden=k!=i;$("t"+k).className=k==i?"on":""}
 if(i==1&&!M.on)newMission(); if(i==2&&!Q.on)newQuiz();}
function draw(arr,cap,flash){
 var h='<div class="stackbox">';
 if(arr.length)h+='';
 arr.forEach(function(x,i){var t=i==arr.length-1;
  h+='<div class="plate'+(t?' top':'')+(t&&flash?' flash':'')+'" style="background:'+C[x].c+'">'+C[x].n+(t?' ⬅ TOP':'')+'</div>'});
 if(!arr.length)h+='<div style="margin:auto;color:var(--mu);font-size:13px;text-align:center">Empty stack</div>';
 return h+'</div>';
}

/* ---------- SEEKHO ---------- */
var S={a:[],cap:6,sel:0,msg:"Pick a color and press <b>Push</b>. Plates are always added or removed from the top only!",fl:false};
function rs(){
 var pal=C.map(function(c,i){return '<div class="dot" onclick="S.sel='+i+';rs()" style="background:'+c.c+';'+(S.sel==i?'border-color:var(--tx);transform:scale(1.15)':'')+'"></div>'}).join("");
 $("p0").innerHTML='<div class="card"><div class="row">'+draw(S.a,S.cap,S.fl)+
 '<div class="side"><div class="tip">Pick a color:</div><div class="pal">'+pal+'</div>'+
 '<div class="btns"><button class="btn b1" onclick="sPush()">⬇ Push</button><button class="btn b2" onclick="sPop()">⬆ Pop</button>'+
 '<button class="btn b3" onclick="sPeek()">👀 Peek</button><button class="btn b4" onclick="sEmpty()">❓ isEmpty</button></div>'+
 '<div class="tip">Size: <b>'+S.a.length+'</b> / '+S.cap+'</div></div></div>'+
 '<div class="msg" style="margin-top:10px">'+S.msg+'</div></div>'+
 '<div class="card"><div class="big">Remember 💡</div><div class="tip" style="font-size:14px">• <b>Push</b> = put a plate on top<br>• <b>Pop</b> = remove the top plate<br>• <b>Peek</b> = just look, do not remove<br>• <b>isEmpty</b> = is the stack empty?<br>• Real life: the browser Back button, Undo (Ctrl+Z), a pile of plates!</div></div>';
 S.fl=false;
}
function sPush(){if(S.a.length>=S.cap){S.msg="🚫 <b>Overflow!</b> The stack is full. Pop something first."}else{S.a.push(S.sel);S.msg="✅ <b>"+C[S.sel].n+"</b> plate placed on top. It is now the TOP.";}rs()}
function sPop(){if(!S.a.length){S.msg="🚫 <b>Underflow!</b> The stack is empty, nothing to remove."}else{var x=S.a.pop();S.msg="✅ Removed the <b>"+C[x].n+"</b> plate from the top. The last one in was the first one out: that is <b>LIFO</b>!"}rs()}
function sPeek(){if(!S.a.length)S.msg="The stack is empty, nothing to look at.";else{S.msg="👀 Top par <b>"+C[S.a[S.a.length-1]].n+"</b> plate is on top. I only looked, I did not remove it.";S.fl=true}rs()}
function sEmpty(){S.msg="isEmpty() = <b>"+(S.a.length?"False":"True")+"</b> "+(S.a.length?"(the stack has "+S.a.length+" plates)":"(the stack is empty)");rs()}
rs();

/* ---------- MISSION ---------- */
var M={on:false,lv:1,score:0,a:[],t:0,need:0,pops:0,phase:0,msg:""};
function newMission(){
 M.on=true;var n=Math.min(M.lv+2,6);
 var idx=[0,1,2,3,4,5].sort(function(){return Math.random()-.5}).slice(0,n);
 M.a=idx;M.t=idx[Math.floor(Math.random()*n)];
 M.need=n-M.a.indexOf(M.t);M.pops=0;M.phase=0;M.msg="Think first, then pop!";rm();
}
function rm(){
 var h='<div class="card"><div class="score">Level '+M.lv+' &nbsp;|&nbsp; Score: '+M.score+' ⭐</div>'+
 '<p>Mission: <span class="chip" style="background:'+C[M.t].c+'">'+C[M.t].n+'</span> plate needs to be removed. You can only pop from the top.</p>';
 h+='<div class="row">'+draw(M.a,6,false)+'<div class="side">';
 if(M.phase==0){h+='<div class="big">Make a guess 🤔</div><div>How many Pops will it take?</div><div class="opts">';
  for(var i=1;i<=M.a.length;i++)h+='<button class="opt" onclick="guess('+i+')">'+i+'</button>';h+='</div>';}
 else if(M.phase==1){h+='<div class="msg">'+M.msg+'</div><button class="btn b2" onclick="mPop()">⬆ Pop</button><div class="tip">Pops so far: '+M.pops+'</div>';}
 else{h+='<div class="msg">'+M.msg+'</div><button class="btn b5" onclick="M.lv=Math.min(M.lv+1,5);newMission()">Next level ➡</button>';}
 $("p1").innerHTML=h+'</div></div></div>';
}
function guess(g){M.phase=1;M.ok=g==M.need;
 M.msg=M.ok?"🎉 Great guess! +10 points. Now pop to prove it.":"The correct answer was <b>"+M.need+"</b>, because the plates above it must be removed first. Now start popping.";
 if(M.ok)M.score+=10;rm()}
function mPop(){var x=M.a.pop();M.pops++;
 if(x==M.t){M.phase=2;M.score+=5;M.msg="🏆 "+C[M.t].n+" found in "+M.pops+" Pops! To reach a plate at the bottom, you must remove everything above it. That is the rule of a stack."}
 else M.msg="Popped: "+C[x].n+". Not the target yet, keep popping.";
 rm()}

/* ---------- QUIZ ---------- */
var Q={on:false,n:0,sc:0,st:[],ops:[],ans:0,done:false};
var L="ABCDE";
function newQuiz(){
 Q.on=true;Q.done=false;var st=[],ops=[],nxt=0,len=5+Math.floor(Q.n/2);
 while(ops.length<len){
  if(st.length>0&&(Math.random()<.4||nxt>=5)){ops.push("Pop");st.pop()}
  else if(nxt<5){ops.push("Push "+L[nxt]);st.push(nxt);nxt++}
 }
 if(!st.length){ops.push("Push "+L[nxt]);st.push(nxt);nxt++}
 Q.ops=ops;Q.ans=st[st.length-1];Q.st=st;rq();
}
function rq(){
 var o=[0,1,2,3,4].map(function(i){return '<button class="opt" id="q'+i+'" onclick="ans('+i+')">'+L[i]+'</button>'}).join("");
 $("p2").innerHTML='<div class="card"><div class="score">Question '+(Q.n+1)+' | Score: '+Q.sc+'</div>'+
 '<p>Start with an empty stack. These operations happen:</p><div class="ops">'+Q.ops.map(function(x,i){return (i+1)+'. '+x}).join("<br>")+
 '</div><p class="big">Which item is on TOP now?</p><div class="opts">'+o+'</div><div class="msg" id="qm">Think carefully: Pop removes the top item.</div></div>';
}
function ans(i){if(Q.done)return;Q.done=true;
 var ok=i==Q.ans;if(ok)Q.sc++;
 $("q"+i).className="opt "+(ok?"right":"wrong");$("q"+Q.ans).className="opt right";
 $("qm").innerHTML=(ok?"🎉 Correct!":"❌ Wrong.")+" Final stack (bottom to top): <b>"+(Q.st.map(function(x){return L[x]}).join(" , ")||"empty")+"</b>. TOP = <b>"+L[Q.ans]+"</b>."+
 '<br><button class="btn b5" style="margin-top:8px" onclick="Q.n++;newQuiz()">Next question ➡</button>';
}
</script>
</body>
</html>
